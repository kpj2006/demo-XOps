name: XOps /send

# The payout is decided in the PR conversation, not in this file. A maintainer
# comments `/send <recipient> <amount> [asset]` and this workflow reads it.
#
# Note: issue_comment workflows always run from the DEFAULT branch, never from
# the PR branch. Editing this file on a branch has no effect until it lands on
# main — which is also why a fork PR cannot alter the payout logic.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  # The receipt comment is the idempotency record, so the run has to be able to
  # read the thread and write back to it.
  issues: write
  pull-requests: write

# Repo-wide, deliberately NOT per-PR.
#
# Two things need serializing and they have different scopes. The receipt check
# is check-then-act, which is per-payout. But every payout is signed by the same
# delegate EOA, and an EOA has one account nonce — two runs signing at once both
# read nonce N and one transaction is silently dropped. The wider scope covers
# both.
#
# cancel-in-progress stays false: killing a run mid-settlement is exactly how a
# payout happens without its receipt getting written.
concurrency:
  group: xops-payout-${{ github.repository }}
  cancel-in-progress: false

jobs:
  send:
    # Only PR comments, and only ones that look like a command. The action
    # enforces the real permission check; this is just to avoid burning a
    # runner on every "lgtm".
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/send')
    runs-on: ubuntu-latest
    steps:
      - name: Run XOps from the comment
        id: xops
        uses: kpj2006/XOps-me@test-harness
        with:
          comment: ${{ github.event.comment.body }}
          actor_association: ${{ github.event.comment.author_association }}
          # Anchor the idempotency key to the PR itself. GITHUB_REF on an
          # issue_comment event points at the default branch, and
          # refs/pull/N/merge changes on every push — neither identifies "this
          # payout" stably.
          ref: refs/pull/${{ github.event.issue.number }}
          actor: ${{ github.event.comment.user.login }}
          asset: USDC
          decimals: "6"

          # An alias for eip155:11155111. XOps resolves it to the CAIP-2 form
          # before building the intent, so the idempotency key and the receipt
          # still carry the canonical spelling — and the chain registry supplies
          # chain_id, allowance_module and explorer_url from it.
          network: sepolia

          # Settles for real once the delegate key exists, and stays a dry run
          # until then. Real settlement is never implicit — no secret, no payout.
          mode: ${{ secrets.XOPS_DELEGATE_KEY != '' && 'self' || 'dry-run' }}

          # L1 policy, declared rather than scripted. XOps evaluates it offline
          # before anything is resolved or signed and prints a per-condition
          # table, so a refusal says which rule refused and why.
          #
          # The kill switch reads a repository variable, so stopping payouts is
          # a settings change rather than a commit — set XOPS_ENABLED to false
          # and the next `/send` refuses before it reaches a driver.
          enabled: ${{ vars.XOPS_ENABLED || 'true' }}
          allowed_associations: OWNER,MEMBER,COLLABORATOR
          # A human decimal, in the same units a `/send` is typed in: 5 USDC.
          max_per_payout: "5"

          # Only what is genuinely this repo's: our endpoint, our Safe, our key.
          # chain_id, allowance_module and explorer_url are functions of the
          # network, so they come from XOps rather than being retyped here.
          rpc_url: ${{ secrets.XOPS_RPC_URL }}
          safe: ${{ vars.XOPS_SAFE }}
          token: ${{ vars.XOPS_TOKEN }}
          delegate_key: ${{ secrets.XOPS_DELEGATE_KEY }}
          pr: ${{ github.event.issue.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        run: |
          echo "STATUS          = ${{ steps.xops.outputs.STATUS }}"
          echo "IDEMPOTENCY_KEY = ${{ steps.xops.outputs.IDEMPOTENCY_KEY }}"
          echo "ERROR_CODE      = ${{ steps.xops.outputs.ERROR_CODE }}"

          case "${{ steps.xops.outputs.STATUS }}" in
            dry-run)      echo "Parsed the command and built the intent. Nothing settled." ;;
            settled)      echo "Payout settled on-chain." ;;
            already-paid) echo "A receipt already exists for this payout. Nothing settled again." ;;
            *)
              echo "::error::unexpected STATUS '${{ steps.xops.outputs.STATUS }}' (${{ steps.xops.outputs.ERROR_CODE }})"
              exit 1
              ;;
          esac
