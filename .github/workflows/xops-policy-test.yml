name: XOps policy gate

# Exercises the maintainer gate with a real Action run, in the configuration
# that would settle for real — same secrets, same driver, same `mode: self`.
#
# What this cannot cover: whether GitHub itself reports CONTRIBUTOR for a
# genuine third party. That is GitHub's behaviour, not ours, and testing it
# needs a second account. Everything downstream of the association value —
# assertMaintainer, the refusal happening before prepare(), and nothing being
# signed, recorded, or broadcast — is covered here.

on:
  workflow_dispatch:
    inputs:
      association:
        description: "author_association to present"
        required: true
        default: CONTRIBUTOR
        type: choice
        options: [CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE, OWNER]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt a payout as ${{ inputs.association }}
        id: xops
        continue-on-error: true
        uses: kpj2006/XOps-me@test-harness
        with:
          comment: "/send 0x00000000000000000000000000000000CafeBabe 0.01 tUSDC"
          actor_association: ${{ inputs.association }}
          ref: refs/pull/1
          actor: policy-test
          asset: tUSDC
          decimals: "6"
          network: sepolia
          # Deliberately a real settlement configuration. If the gate leaks,
          # this moves money — which is exactly what the test must rule out.
          mode: self
          rpc_url: ${{ secrets.XOPS_RPC_URL }}
          safe: ${{ vars.XOPS_SAFE }}
          token: ${{ vars.XOPS_TOKEN }}
          delegate_key: ${{ secrets.XOPS_DELEGATE_KEY }}
          pr: 1
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: A non-maintainer must be refused
        if: inputs.association != 'OWNER'
        # The decision table is unit-tested offline in test/core/policy.test.ts,
        # so this asserts only what a unit test cannot: that the gate fires
        # inside a real Action run, in a real settlement configuration, and that
        # nothing was signed on the way to refusing.
        #
        # Outputs come in as env vars rather than `${{ }}` interpolated into the
        # script, so the shell never parses values the action produced.
        env:
          STATUS: ${{ steps.xops.outputs.STATUS }}
          ERROR_CODE: ${{ steps.xops.outputs.ERROR_CODE }}
          TX_HASH: ${{ steps.xops.outputs.TX_HASH }}
        run: |
          echo "STATUS=$STATUS ERROR_CODE=$ERROR_CODE TX_HASH=${TX_HASH:-none}"

          if [ "$STATUS" = "error" ] && [ "$ERROR_CODE" = "POLICY_DENIED" ] && [ -z "$TX_HASH" ]; then
            echo "Refused with POLICY_DENIED, and no transaction hash, so nothing was signed."
          else
            echo "::error::the gate leaked — status=$STATUS code=$ERROR_CODE tx=${TX_HASH:-none}"
            exit 1
          fi
