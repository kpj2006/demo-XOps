name: XOps dry-run

# Exercises the XOps action end to end in dry-run mode. This proves the action
# wiring works — the bundle loads under node20, inputs plumb through, the intent
# parses, the resolver produces a payout target, the idempotency key derives, and
# outputs land in GITHUB_OUTPUT.
#
# It does NOT move any tokens. No settlement driver ships yet, so any mode other
# than dry-run hits an empty driver registry and fails by design.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Run XOps
        id: xops
        uses: kpj2006/XOps-me@test-harness
        with:
          # Burn address — this is a dry run, nothing is sent anywhere.
          recipient: "0x000000000000000000000000000000000000dEaD"
          # Atomic units. USDC has 6 decimals, so this is 2.50 USDC.
          amount: "2500000"
          asset: USDC
          # Ethereum Sepolia — the Safe AllowanceModule is deployed here,
          # and is absent from Base Sepolia. See AGENTS.md.
          network: "eip155:11155111"
          mode: dry-run

      - name: Assert the action reported a dry run
        run: |
          echo "STATUS          = ${{ steps.xops.outputs.STATUS }}"
          echo "IDEMPOTENCY_KEY = ${{ steps.xops.outputs.IDEMPOTENCY_KEY }}"
          echo "ERROR_CODE      = ${{ steps.xops.outputs.ERROR_CODE }}"

          if [ "${{ steps.xops.outputs.STATUS }}" != "dry-run" ]; then
            echo "::error::expected STATUS=dry-run, got '${{ steps.xops.outputs.STATUS }}'"
            exit 1
          fi

          if [ -z "${{ steps.xops.outputs.IDEMPOTENCY_KEY }}" ]; then
            echo "::error::IDEMPOTENCY_KEY was empty — the key never derived"
            exit 1
          fi

          echo "XOps action wiring is working."

      - name: Re-run with identical inputs and assert the key is stable
        id: xops_again
        uses: kpj2006/XOps-me@test-harness
        with:
          recipient: "0x000000000000000000000000000000000000dEaD"
          amount: "2500000"
          asset: USDC
          network: "eip155:11155111"
          mode: dry-run

      - name: Assert idempotency key is deterministic
        run: |
          FIRST="${{ steps.xops.outputs.IDEMPOTENCY_KEY }}"
          SECOND="${{ steps.xops_again.outputs.IDEMPOTENCY_KEY }}"
          echo "first  = $FIRST"
          echo "second = $SECOND"

          if [ "$FIRST" != "$SECOND" ]; then
            echo "::error::identical inputs produced different keys — idempotency is broken"
            exit 1
          fi

          echo "Idempotency key is deterministic across runs."
